#
# Pipeline that will build the service project and publish the artifacts so 
# they can be picked up by a release. This pipeline builds/publishes a single 
# project: PortalRestService.Api
#
# This will publish the API project to a folder named /publish and then copy the Dockerfile
# to the root directory. This directory structure will match what the Dockerfile expects
#
# Example directory structure of artifacts:
#
#  /
#    Dockerfile
#    /publish
#      ...
#      ...
#

trigger:
- none

pool:
  vmImage: ubuntu-latest # todo change to self-hosted agent

variables:
  projectName: 'PortalRestService.Api'

jobs: 
- job: PublishServiceArtifacts
  steps:

    # ensure the build agent is using .NET 6
    - task: UseDotNet@2
      displayName: 'Use .NET 6 SDK'
      inputs:
        packageType: sdk
        version: 6.x
        installationPath: $(Agent.ToolsDirectory)/dotnet
    
    # restore the api project
    - task: DotNetCoreCLI@2
      displayName: 'Restore Service'
      inputs:        
        command: 'restore'
        projects: '**/$(projectName).csproj'
        feedsToUse: 'select'
    
    # build the api project
    - task: DotNetCoreCLI@2
      displayName: 'Build Service'
      inputs:
        command: 'build'
        projects: '**/$(projectName).csproj'
    
    # publish the api project to the artifact directory
    - task: DotNetCoreCLI@2
      displayName: 'Publish Service'
      inputs:
        command: 'publish'
        nobuild: true
        publishWebProjects: false
        projects: '**/$(projectName).csproj'
        arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: false

    # move the files into a folder named publish 
    - task: CopyFiles@2
      inputs:
        SourceFolder: '$(Build.ArtifactStagingDirectory)/$(projectName)'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/publish'
    
    # delete the original publish folder
    - task: DeleteFiles@1
      inputs:
        SourceFolder: '$(Build.ArtifactStagingDirectory)'
        Contents: '$(projectName)'

    # copy the docker file to the artifact directory
    - task: CopyFiles@2
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: '**/Dockerfile'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        flattenFolders: true
    
    # publish the artifacts
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'
